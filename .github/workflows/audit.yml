name: Run audit and publish to GitHub Pages

# Manually trigger this from the Actions tab, filling in the target URL.
# The crawl runs on GitHub's runner (a real Python VM — no browser CORS
# limits), and the resulting static report is published via GitHub Pages.
#
# This workflow deliberately does NOT include a Playwright browser install
# step or a mid-job git-commit step — both were tried in an earlier version
# of this project and repeatedly caused the Pages deploy to fail or hang.
# JS rendering and run-history trend tracking are only in the sibling
# Streamlit/Docker build now, which doesn't share this deploy pipeline.
on:
  workflow_dispatch:
    inputs:
      start_url:
        description: "Site to audit (must include http:// or https://)"
        required: true
        type: string
      audit_mode:
        description: "Choose how deeply to audit the site"
        required: true
        type: choice
        default: quick
        options:
          - quick
          - full
      full_max_pages:
        description: "Full audit page limit (used only in Full mode; 100–5000)"
        required: false
        default: "500"
        type: string
      respect_robots:
        description: "Respect robots.txt"
        type: boolean
        default: true
      use_sitemap:
        description: "Seed extra URLs from sitemap.xml"
        type: boolean
        default: true
      include_subdomains:
        description: "Include subdomains as in-scope"
        type: boolean
        default: false
      check_external_links:
        description: "Spot-check external links"
        type: boolean
        default: false
      custom_user_agent:
        description: "Optional custom User-Agent for authorized audits"
        required: false
        default: ""
        type: string
      custom_personas:
        description: "Optional custom persona(s) for journey mapping"
        required: false
        default: ""
        type: string
      include_url_patterns:
        description: "Optional comma-separated URL substrings to include"
        required: false
        default: ""
        type: string
      exclude_url_patterns:
        description: "Optional comma-separated URL substrings to exclude"
        required: false
        default: ""
        type: string
      client_stated_page_count:
        description: "Optional client-stated page count for variance analysis"
        required: false
        default: ""
        type: string


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # false (not the GitHub Pages boilerplate default of true) is the whole
  # point here: with true, triggering a new run CANCELS whatever's still
  # running in this group — so if two people (or the same person twice)
  # start an audit close together, only the newest survives and the
  # other shows up as a failed/cancelled run. With false, GitHub instead
  # queues additional runs and starts each one in the order it was
  # triggered (FIFO) once the current one finishes — nothing gets
  # cancelled, everyone's run eventually runs.
  cancel-in-progress: false

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run audit
        env:
          START_URL: ${{ inputs.start_url }}
          MAX_PAGES: ${{ inputs.audit_mode == 'quick' && '25' || inputs.full_max_pages }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          CONCURRENCY: ${{ inputs.concurrency }}
          RESPECT_ROBOTS: ${{ inputs.respect_robots }}
          USE_SITEMAP: ${{ inputs.use_sitemap }}
          INCLUDE_SUBDOMAINS: ${{ inputs.include_subdomains }}
          CHECK_EXTERNAL_LINKS: ${{ inputs.check_external_links }}
          # Optional secret — AI summary is skipped without it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # UAT/staging Basic Auth credentials, if this repo has them set as
          # secrets — deliberately NOT a workflow_dispatch input, since a
          # public repo's run inputs (unlike secrets) are visible to anyone
          # who can see the Actions run. Set once in Settings > Secrets,
          # covers whichever one UAT site you're auditing via this path.
          BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
          CUSTOM_USER_AGENT: ${{ inputs.custom_user_agent }}
          CUSTOM_PERSONAS: ${{ inputs.custom_personas }}
          INCLUDE_URL_PATTERNS: ${{ inputs.include_url_patterns }}
          EXCLUDE_URL_PATTERNS: ${{ inputs.exclude_url_patterns }}
          CLIENT_STATED_PAGE_COUNT: ${{ inputs.client_stated_page_count }}
          # Both modes use Chromium. Quick mode renders a representative sample;
          # Full mode renders a larger sample while the HTTP crawler covers the configured page set.
          RENDER_JS: "true"
          BROWSER_MAX_PAGES: ${{ inputs.audit_mode == 'quick' && '10' || '50' }}
        run: python run_audit_cli.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: audit-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
