name: Run UX Audit and Publish

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to audit"
        required: true
        type: string
      max_pages:
        description: "Maximum pages to crawl"
        required: true
        default: "25"
        type: string
      render_js:
        description: "Enable JavaScript rendering"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  audit:
    name: Run UX Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        if: ${{ inputs.render_js }}
        run: |
          python -m playwright install --with-deps chromium

      - name: Run UX Audit
        env:
          START_URL: ${{ inputs.url }}
          RENDER_JS: ${{ inputs.render_js }}
          BROWSER_MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python run_audit_cli.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4